      statuses: write
    with:
      binary-build-command: |-
        OUTPUT_NAME=buidlerfest
        if [ "$MATRIX_OS" = "windows" ]; then
          OUTPUT_NAME="$OUTPUT_NAME.exe"
        fi
        GOOS="$MATRIX_OS" GOARCH="$MATRIX_ARCH" go build -ldflags "-s -w -X main.Version=$RELEASE_TAG -X main.Commit=$COMMIT_HASH -X main.BuildDate=$BUILD_DATE" -o "$OUTPUT_NAME" ./cmd/buidlerfest
      binary-name: buidlerfest
      binary-target-matrix: '[{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"},{"os":"darwin","arch":"amd64"},{"os":"darwin","arch":"arm64"},{"os":"windows","arch":"amd64"}]'
      create-checksums: true
      go-version: 1.26.x
      prerelease: ${{ contains(github.ref, '-') }}
      publish-container-image: false
