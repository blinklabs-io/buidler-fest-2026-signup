name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  go-test:
    uses: blinklabs-io/actions/.github/workflows/reuseable-go-test.yml@main
    with:
      go-versions: '["1.26.x"]'
      golangci-go-version: 1.26.x
      run-build: true
      run-golangci-lint: true
      run-vet: true
      test-flags: -v -race
      verify-modules: true
  publish:
    needs: [go-test]
    if: startsWith(github.ref, 'refs/tags/')
    uses: blinklabs-io/actions/.github/workflows/reuseable-publish.yml@main
